<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" font-family="Avenir Next, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A4C"/>
      <stop offset="1" stop-color="#232F3E"/>
    </linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1,1.5 L8,5 L1,8.5" fill="none" stroke="#8A97A4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1,1.5 L8,5 L1,8.5" fill="none" stroke="#EC7211" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="card" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#232F3E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="556" fill="#FBFBFA"/>

  <!-- Header -->
  <text x="56" y="54" font-size="30" fill="#16212E" font-weight="700">Six Agent Skills for Automated Reasoning checks</text>
  <text x="56" y="82" font-size="16" fill="#5A6B7B">Turn a policy document into rules a guardrail can check, and keep every answer sound.</text>
  <line x1="56" y1="102" x2="1144" y2="102" stroke="#E3E7EB" stroke-width="1"/>

  <!-- ============ PHASE 1: BUILD ============ -->
  <text x="56" y="132" font-size="13.5" letter-spacing="2.5" fill="#5A6B7B" font-weight="700">BUILD THE POLICY</text>

  <g>
    <!-- 1 Builder -->
    <g filter="url(#card)">
      <rect x="56" y="146" width="251" height="94" rx="12" fill="#FFFFFF" stroke="#E3E7EB"/>
      <circle cx="86" cy="180" r="14" fill="#FF9900"/><text x="86" y="185" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
      <text x="112" y="186" font-size="19" fill="#16212E" font-weight="700">Builder</text>
      <text x="82" y="222" font-size="14.5" fill="#5A6B7B">Rules from your document</text>
    </g>
    <!-- 2 Reviewer -->
    <g filter="url(#card)">
      <rect x="335" y="146" width="251" height="94" rx="12" fill="#FFFFFF" stroke="#E3E7EB"/>
      <circle cx="365" cy="180" r="14" fill="#FF9900"/><text x="365" y="185" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
      <text x="391" y="186" font-size="19" fill="#16212E" font-weight="700">Reviewer</text>
      <text x="361" y="222" font-size="14.5" fill="#5A6B7B">Catch problems early</text>
    </g>
    <!-- 3 Tester -->
    <g filter="url(#card)">
      <rect x="614" y="146" width="251" height="94" rx="12" fill="#FFFFFF" stroke="#E3E7EB"/>
      <circle cx="644" cy="180" r="14" fill="#FF9900"/><text x="644" y="185" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
      <text x="670" y="186" font-size="19" fill="#16212E" font-weight="700">Tester</text>
      <text x="640" y="222" font-size="14.5" fill="#5A6B7B">Prove the rules work</text>
    </g>
    <!-- 4 Debugger -->
    <g filter="url(#card)">
      <rect x="893" y="146" width="251" height="94" rx="12" fill="#FFFFFF" stroke="#E3E7EB"/>
      <circle cx="923" cy="180" r="14" fill="#FF9900"/><text x="923" y="185" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
      <text x="949" y="186" font-size="19" fill="#16212E" font-weight="700">Debugger</text>
      <text x="919" y="222" font-size="14.5" fill="#5A6B7B">Fix what fails</text>
    </g>
  </g>

  <!-- connectors -->
  <line x1="307" y1="193" x2="335" y2="193" stroke="#8A97A4" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="586" y1="193" x2="614" y2="193" stroke="#8A97A4" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="865" y1="193" x2="893" y2="193" stroke="#8A97A4" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- refine loop -->
  <path d="M1018,240 C1018,280 460,280 460,244" fill="none" stroke="#EC7211" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#ao)"/>
  <rect x="678" y="269" width="124" height="22" rx="11" fill="#FBFBFA"/>
  <text x="740" y="284" font-size="13" fill="#B0623A" font-weight="600" text-anchor="middle">fix and re-test</text>

  <!-- ============ PHASE 2: RUN ============ -->
  <line x1="56" y1="314" x2="1144" y2="314" stroke="#E3E7EB" stroke-width="1"/>
  <text x="56" y="344" font-size="13.5" letter-spacing="2.5" fill="#5A6B7B" font-weight="700">USE IT AT RUNTIME</text>

  <!-- 5 Deployer -->
  <g filter="url(#card)">
    <rect x="56" y="358" width="251" height="112" rx="12" fill="url(#navy)"/>
    <circle cx="86" cy="392" r="14" fill="#FF9900"/><text x="86" y="397" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
    <text x="112" y="398" font-size="19" fill="#FFFFFF" font-weight="700">Deployer</text>
    <text x="82" y="438" font-size="14.5" fill="#C4CDD6">Attach the policy to</text>
    <text x="82" y="459" font-size="14.5" fill="#C4CDD6">a guardrail</text>
  </g>
  <!-- 6 Validator -->
  <g filter="url(#card)">
    <rect x="335" y="358" width="251" height="112" rx="12" fill="url(#navy)"/>
    <circle cx="365" cy="392" r="14" fill="#FF9900"/><text x="365" y="397" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
    <text x="391" y="398" font-size="19" fill="#FFFFFF" font-weight="700">Validator</text>
    <text x="361" y="438" font-size="14.5" fill="#C4CDD6">Check every answer</text>
    <text x="361" y="459" font-size="14.5" fill="#C4CDD6">the model gives</text>
  </g>

  <line x1="307" y1="414" x2="335" y2="414" stroke="#8A97A4" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="586" y1="414" x2="614" y2="414" stroke="#8A97A4" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- findings panel -->
  <g filter="url(#card)">
    <rect x="614" y="358" width="530" height="112" rx="12" fill="#FFFFFF" stroke="#E3E7EB"/>
    <text x="638" y="384" font-size="15.5" fill="#16212E" font-weight="700">Every answer gets a verdict</text>
    <g font-size="14">
      <circle cx="648" cy="408" r="5" fill="#1D8102"/><text x="664" y="413" fill="#16212E" font-weight="700">VALID</text><text x="720" y="413" fill="#8A97A4">serve it</text>
      <circle cx="648" cy="432" r="5" fill="#B7791F"/><text x="664" y="437" fill="#16212E" font-weight="700">SATISFIABLE</text><text x="776" y="437" fill="#8A97A4">incomplete</text>
      <circle cx="648" cy="456" r="5" fill="#D13212"/><text x="664" y="461" fill="#16212E" font-weight="700">INVALID</text><text x="734" y="461" fill="#8A97A4">breaks a rule</text>

      <circle cx="918" cy="408" r="5" fill="#9B1C0B"/><text x="934" y="413" fill="#16212E" font-weight="700">IMPOSSIBLE</text><text x="1038" y="413" fill="#8A97A4">rules clash</text>
      <circle cx="918" cy="432" r="5" fill="#6B46C1"/><text x="934" y="437" fill="#16212E" font-weight="700">AMBIGUOUS</text><text x="1038" y="437" fill="#8A97A4">unclear</text>
      <text x="918" y="461" fill="#A9B2BB" font-size="12.5">+ too&#8209;complex, no&#8209;translations</text>
    </g>
  </g>

  <!-- explainability caption under the findings box -->
  <text x="614" y="492" font-size="12.5" fill="#16212E" font-weight="700">Every verdict is explainable.</text>
  <text x="808" y="492" font-size="12.5" fill="#5A6B7B">It returns the <tspan font-weight="700" fill="#1D6B07">supporting</tspan> or <tspan font-weight="700" fill="#A8290F">contradicting</tspan> rules behind it,</text>
  <text x="614" y="510" font-size="12.5" fill="#5A6B7B">as mathematically verifiable proof you can log and audit.</text>

  <!-- Valid@N loop -->
  <path d="M520,470 C520,506 400,506 400,472" fill="none" stroke="#EC7211" stroke-width="1.8" marker-end="url(#ao)"/>
  <rect x="382" y="496" width="156" height="22" rx="11" fill="#FBFBFA"/>
  <text x="460" y="511" font-size="13" fill="#B0623A" font-weight="700" text-anchor="middle">rewrite until VALID</text>

  <!-- footer -->
  <line x1="56" y1="524" x2="1144" y2="524" stroke="#EEF1F4" stroke-width="1"/>
  <text x="56" y="544" font-size="13" fill="#16212E" font-weight="600">Each skill is a focused Agent Skill with runnable scripts.</text>
  <text x="476" y="544" font-size="13" fill="#5A6B7B">Skills 1&#8211;4 build the policy; 5&#8211;6 run it in production.</text>
</svg>
